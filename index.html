  if(!u||!db){SOC={ok:0,err:'claude.ai에 로그인해야 친구·거래를 쓸 수 있어요.'};return}

function soPay(g){P.gem=Math.max(0,P.gem+g)}
async function socPull(rd){const s=SOC;if(!s||!s.ok||soBusy)return;soBusy=1;let dirtyW=0,dirtyP=0;
 try{const me=s.me,myid=s.id;P.tapp=P.tapp||{};P.tsd=P.tsd||{};
  // 친구 문서
  const ids=[...new Set([...me.fr,...me.req])].slice(0,40),docs={};
  await Promise.all(ids.map(async i=>{docs[i]=await soGet(i)}));
  // 내가 보낸 요청이 수락됨 → 친구로
  for(const i of me.req.slice()){const d=docs[i];if(d&&(d.fr||[]).includes(myid)){if(!me.fr.includes(i))me.fr.push(i);me.req=me.req.filter(x=>x!=i);dirtyW=1}}
  // 상대가 나를 지웠으면 정리
  s.friends=[];for(const i of me.fr){const d=docs[i];if(!d)continue;if((d.fr||[]).includes(myid)||(d.req||[]).includes(myid))s.friends.push({id:i,nick:d.nick||'?',code:d.code||'',lv:d.lv||1,off:d.off||[]});}
  s.out=me.req.map(i=>({id:i,nick:(docs[i]||{}).nick||'?',code:(docs[i]||{}).code||''}));
  // 받은 요청
  try{const q=await stm(s.db.collection('pub').where('req','array-contains',myid).limit(30).get());s.inc=q.docs.filter(x=>!me.fr.includes(x.id)).map(x=>({id:x.id,nick:x.data().nick||'?',code:x.data().code||''}))}catch(_){s.inc=[]}
  if(tab=='fr'){try{const q=await stm(s.db.collection('pub').orderBy('ts','desc').limit(60).get());s.dir=q.docs.filter(x=>x.id!=myid&&!me.fr.includes(x.id)&&!me.req.includes(x.id)).slice(0,30).map(x=>({id:x.id,nick:x.data().nick||'?',code:x.data().code||'',lv:x.data().lv||1,rq:x.data().req||[]}))}catch(_){s.dir=s.dir||[]}}
  // 내가 낸 제안 처리
  for(const o of me.off){if(o.st!='o')continue;const rd2=docs[o.to]||await soGet(o.to),a=rd2&&(rd2.ack||{})[o.id];if(!a)continue;
   if(a.r=='a'&&!P.tsd[o.id]){const w=wcl(o.want);soPay(w.gem);P.tsd[o.id]=1;o.st='d';dirtyW=dirtyP=1}
   else if(a.r=='d'&&!P.tsd[o.id]){const g=wcl(o.give);soPay(g.gem);P.tsd[o.id]=1;o.st='r';dirtyW=dirtyP=1}
   else if(P.tsd[o.id]){o.st=o.st=='o'?'d':o.st;dirtyW=1}}
  // 내가 수락한 제안 반영 (재화 이동)
  for(const k in me.ack){const a=me.ack[k];if(a.r=='a'&&!a.ap&&!P.tapp[k]){const g=wcl(a.gv),w=wcl(a.wt);soPay(g.gem-w.gem);P.tapp[k]=1;a.ap=1;dirtyW=dirtyP=1}else if(a.r=='a'&&!a.ap&&P.tapp[k]){a.ap=1;dirtyW=1}}
  // 들어온 제안
  s.ino=[];for(const f of s.friends)for(const o of f.off)if(o.to==myid&&o.st=='o'&&!me.ack[o.id])s.ino.push({id:o.id,from:f.id,nick:f.nick,give:wcl(o.give),want:wcl(o.want)});
  // 지난 기록 정리
  me.off=me.off.filter((o,i,a)=>o.st=='o'||i>=a.length-12);
  for(const k in me.ack){const a=me.ack[k],gdoc=docs[a.from];if(!gdoc)continue;const go=(gdoc.off||[]).find(o=>o.id==k);if((!go||go.st!='o')&&(a.r=='d'||a.ap))delete me.ack[k]}
  // 거래 내역
  s.trades=[...me.off.slice().reverse().map(o=>({mine:1,id:o.id,st:o.st,give:wcl(o.give),want:wcl(o.want),nick:((docs[o.to]||{}).nick)||'?'})),...s.ino.map(o=>({mine:0,id:o.id,st:'o',give:o.give,want:o.want,nick:o.nick,idx:1}))];
  if(dirtyP){save()}
  if(dirtyW&&!s.ro){try{await soWrite()}catch(_){}}
 }catch(e){}
 soBusy=0;if(rd!==false&&tab=='fr'&&!$('lobby').hidden&&!(document.activeElement&&document.activeElement.tagName=='INPUT'))render();else if(dirtyP&&!$('lobby').hidden)render()}
